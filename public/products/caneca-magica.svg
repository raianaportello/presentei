<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="66%">
      <stop offset="0%" stop-color="#fff8f2"/>
      <stop offset="100%" stop-color="#f0e6dc"/>
    </radialGradient>
    <linearGradient id="body" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#1a1816"/>
      <stop offset="28%"  stop-color="#26211f"/>
      <stop offset="46%"  stop-color="#a03200"/>
      <stop offset="60%"  stop-color="#d94c00"/>
      <stop offset="74%"  stop-color="#ff6010"/>
      <stop offset="100%" stop-color="#d94800"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1c1a18"/>
      <stop offset="50%"  stop-color="#2e2c2a"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <radialGradient id="inner" cx="42%" cy="33%" r="62%">
      <stop offset="0%"   stop-color="#7a6e66"/>
      <stop offset="100%" stop-color="#242020"/>
    </radialGradient>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1a1816"/>
      <stop offset="45%"  stop-color="#c04400"/>
      <stop offset="100%" stop-color="#1a1816"/>
    </linearGradient>
    <filter id="shadow" x="-28%" y="-22%" width="156%" height="156%">
      <feDropShadow dx="2" dy="18" stdDeviation="17" flood-color="rgba(60,18,4,0.34)"/>
    </filter>
    <filter id="sparkglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Steam wisps -->
  <g opacity="0.42" stroke="#d06030" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 148 48 C 144 38,152 28,148 18"/>
    <path d="M 168 42 C 164 30,172 18,168 6"/>
    <path d="M 188 46 C 184 34,192 22,188 10"/>
    <path d="M 208 42 C 204 30,212 18,208 6"/>
  </g>

  <ellipse cx="178" cy="362" rx="108" ry="12" fill="rgba(60,20,5,0.20)"/>

  <g filter="url(#shadow)">
    <rect x="82" y="64" width="190" height="268" fill="url(#body)"/>
    <ellipse cx="177" cy="332" rx="95" ry="14" fill="url(#base)"/>
    <rect x="82" y="318" width="190" height="14" fill="url(#body)"/>
    <ellipse cx="177" cy="64" rx="95" ry="20" fill="url(#body)"/>

    <!-- Thermochromic boundary -->
    <path d="M 162 64 C 160 130,158 200,161 268 C 162 290,161 310,162 332"
          stroke="rgba(255,140,60,0.22)" stroke-width="14" stroke-linecap="round"/>

    <path d="M 270 160 C 326 160,350 190,350 230 C 350 270,326 300,270 300"
          stroke="url(#handle)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 270 170 C 316 170,334 196,334 230 C 334 264,316 290,270 290"
          stroke="rgba(0,0,0,0.30)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 270 163 C 324 163,347 192,347 230"
          stroke="rgba(255,255,255,0.22)" stroke-width="5" stroke-linecap="round"/>

    <ellipse cx="177" cy="64" rx="84" ry="17" fill="url(#inner)"/>
    <ellipse cx="177" cy="60" rx="94" ry="20" fill="none"
             stroke="rgba(255,255,255,0.38)" stroke-width="7"/>
    <ellipse cx="177" cy="65" rx="84" ry="17" fill="none"
             stroke="rgba(0,0,0,0.18)" stroke-width="3"/>

    <!-- Magic sparkle art element -->
    <g filter="url(#sparkglow)" transform="translate(177,202)">
      <path d="M0,-44 C4,-9,9,-4,44,0 C9,4,4,9,0,44 C-4,9,-9,4,-44,0 C-9,-4,-4,-9,0,-44 Z"
            fill="white" opacity="0.96"/>
      <path d="M0,-28 C3,-7,7,-3,28,0 C7,3,3,7,0,28 C-3,7,-7,3,-28,0 C-7,-3,-3,-7,0,-28 Z"
            fill="#ffe0a0" opacity="0.70"/>
      <circle cx="0" cy="0" r="5.5" fill="white"/>
      <circle cx="0"   cy="-52" r="2.8" fill="white" opacity="0.58"/>
      <circle cx="52"  cy="0"   r="2.8" fill="white" opacity="0.58"/>
      <circle cx="0"   cy="52"  r="2.8" fill="white" opacity="0.58"/>
      <circle cx="-52" cy="0"   r="2.8" fill="white" opacity="0.58"/>
      <circle cx="32"  cy="-32" r="2" fill="white" opacity="0.40"/>
      <circle cx="32"  cy="32"  r="2" fill="white" opacity="0.40"/>
      <circle cx="-32" cy="-32" r="2" fill="white" opacity="0.40"/>
      <circle cx="-32" cy="32"  r="2" fill="white" opacity="0.40"/>
    </g>

    <!-- Dark-side subtle highlight -->
    <path d="M 112 66 C 117 94,118 196,116 316"
          stroke="rgba(255,255,255,0.06)" stroke-width="22" stroke-linecap="round"/>

    <!-- Orange-side bright highlights -->
    <path d="M 216 68 C 230,84,234,168,231,248 C 229,296,224,328,218,344"
          stroke="rgba(255,255,255,0.28)" stroke-width="30" stroke-linecap="round"/>
    <path d="M 214 68 C 227,84,231,168,228,248 C 226,296,222,328,216,344"
          stroke="rgba(255,255,255,0.52)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 215 70 C 227,86,230,132,228,172"
          stroke="rgba(255,255,255,0.72)" stroke-width="4" stroke-linecap="round"/>

    <rect x="82" y="64" width="18" height="268" fill="rgba(0,0,0,0.14)"/>
    <rect x="82" y="300" width="190" height="32" fill="rgba(0,0,0,0.07)"/>
  </g>
</svg>
