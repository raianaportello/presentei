<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="bg" cx="48%" cy="44%" r="64%">
      <stop offset="0%" stop-color="#fffaf6"/>
      <stop offset="100%" stop-color="#f4ece4"/>
    </radialGradient>
    <linearGradient id="body" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#b0a9a4"/>
      <stop offset="12%"  stop-color="#d6d0cc"/>
      <stop offset="34%"  stop-color="#f2efec"/>
      <stop offset="54%"  stop-color="#ffffff"/>
      <stop offset="70%"  stop-color="#eae5e2"/>
      <stop offset="100%" stop-color="#c8c2be"/>
    </linearGradient>
    <linearGradient id="handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#cec8c4"/>
      <stop offset="50%"  stop-color="#edeae7"/>
      <stop offset="100%" stop-color="#bdb7b3"/>
    </linearGradient>
    <radialGradient id="inner" cx="42%" cy="33%" r="62%">
      <stop offset="0%"   stop-color="#9e9690"/>
      <stop offset="100%" stop-color="#464040"/>
    </radialGradient>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a6a09c"/>
      <stop offset="50%"  stop-color="#c6c2be"/>
      <stop offset="100%" stop-color="#b4aeaa"/>
    </linearGradient>
    <filter id="shadow" x="-28%" y="-22%" width="156%" height="156%">
      <feDropShadow dx="2" dy="18" stdDeviation="17" flood-color="rgba(26,9,3,0.25)"/>
    </filter>
    <filter id="heartglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <ellipse cx="178" cy="362" rx="108" ry="12" fill="rgba(18,7,2,0.14)"/>

  <g filter="url(#shadow)">
    <rect x="82" y="64" width="190" height="268" fill="url(#body)"/>
    <ellipse cx="177" cy="332" rx="95" ry="14" fill="url(#base)"/>
    <rect x="82" y="318" width="190" height="14" fill="url(#body)"/>
    <ellipse cx="177" cy="64" rx="95" ry="20" fill="url(#body)"/>

    <path d="M 270 160 C 326 160,350 190,350 230 C 350 270,326 300,270 300"
          stroke="url(#handle)" stroke-width="26" stroke-linecap="round"/>
    <path d="M 270 170 C 316 170,334 196,334 230 C 334 264,316 290,270 290"
          stroke="rgba(70,35,12,0.09)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 270 163 C 324 163,347 192,347 230"
          stroke="rgba(255,255,255,0.68)" stroke-width="5" stroke-linecap="round"/>

    <ellipse cx="177" cy="64" rx="84" ry="17" fill="url(#inner)"/>
    <ellipse cx="177" cy="60" rx="94" ry="20" fill="none"
