    <ellipse cx="177" cy="65" rx="84" ry="17" fill="none"
             stroke="rgba(0,0,0,0.05)" stroke-width="3"/>

    <!-- Brushstroke heart art element -->
    <g filter="url(#heartglow)" transform="translate(177,202)">
      <path d="M0,-30 C8,-47,36,-47,36,-23 C36,0,0,30,0,30 C0,30,-36,0,-36,-23 C-36,-47,-8,-47,0,-30 Z"
            fill="#ff620f" opacity="0.93"/>
      <path d="M0,-21 C5,-33,24,-33,24,-16 C24,0,0,20,0,20 C0,20,-24,0,-24,-16 C-24,-33,-5,-33,0,-21 Z"
            fill="#ff7e36" opacity="0.45"/>
      <path d="M-9,-26 C-3,-38,14,-38,14,-24"
            stroke="rgba(255,255,255,0.38)" stroke-width="4" stroke-linecap="round"/>
    </g>

    <path d="M 205 68 C 220,84,226,168,223,248 C 221,296,216,328,210,344"
          stroke="rgba(255,255,255,0.44)" stroke-width="38" stroke-linecap="round"/>
    <path d="M 203 68 C 217,84,222,168,219,248 C 217,296,213,328,207,344"
          stroke="rgba(255,255,255,0.67)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 204 70 C 217,84,221,130,219,172"
          stroke="rgba(255,255,255,0.88)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 148 66 C 154,112,156,210,154,320"
          stroke="rgba(255,255,255,0.09)" stroke-width="44" stroke-linecap="round"/>

    <rect x="82" y="64" width="20" height="268" fill="rgba(0,0,0,0.055)"/>
    <rect x="252" y="64" width="20" height="268" fill="rgba(0,0,0,0.025)"/>
    <rect x="82" y="296" width="190" height="36" fill="rgba(0,0,0,0.038)"/>
  </g>
</svg>
